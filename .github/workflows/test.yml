name: Validate GTM Template

# Pre-release check. The GTM Community Template Gallery releases a new
# metadata.yaml version on the default branch, so this job gates every change
# before it lands on master. The validator is fully environment-independent:
# no secrets, no network, no third-party packages; it will not block a
# legitimate release for transient/credential reasons.
#
# Triggers (CI cost and speed standard, 2026-10-14): a ready PR and the merge
# queue. master takes changes only through the merge queue (ruleset
# merge-queue-master, which requires the `conversion-script-gate` check), so
# the queue run validates the exact merge commit that lands; the old
# post-merge push run re-checked that same commit and is gone. Draft PRs run
# nothing: the job is skipped, and a skipped job reports the required check
# as passing, so a draft never deadlocks. Marking the PR ready starts the real
# run. The suite takes seconds, so there is no scope step and no sharding: the
# job bills one minute either way.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A newer push to the same PR cancels the older run; a merge-queue run has its
# own ref per group and is never cancelled by a PR push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    # The job name IS the required status check (ruleset merge-queue-master):
    # never rename it.
    name: conversion-script-gate
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the metadata.yaml sha can be verified as a real
          # commit reachable in this checkout.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Validate template & metadata
        run: npm test
